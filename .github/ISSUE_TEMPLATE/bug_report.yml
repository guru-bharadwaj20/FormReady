name: Bug report
description: Something in the app does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, what did you see instead?
    validations:
      required: true
  - type: input
    id: portal
    attributes:
      label: Portal and form
      placeholder: e.g. SSC CGL 2026, photo
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Chrome 131 on Android 13
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: Input file details
      description: Format, size and dimensions. Please do not attach photos of real people or real documents.
